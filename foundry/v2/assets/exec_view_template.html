<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry — Executive Summary</title>
<style>
  :root{
    /* Foundry Exec Summary (cover) skin — verified against the live console (dark navy) */
    --shell:#0D1626; --surface:#182640; --elevated:#131F33; --interactive:#1E2B44;
    --border:#24334D; --border-hi:#33415C; --border-soft:#1E2C46;
    --navy:#0D1626; --navy2:#182640;
    --text:#EDF0F5; --text2:#C6CFDE; --muted:#8C99AF; --meta:#8C99AF;
    --gold:#DFA85A; --gold2:#E8BC77; --goldbtn:#D8A85E;
    --pass:#34D399; --warn:#FBBF24; --fail:#F87171; --info:#67A6FF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--shell);color:var(--text);font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .app{min-height:100vh;padding:0 0 44px;background:var(--shell)}
  .wrap{max-width:none;margin:0;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold2)}
  button{font-family:inherit;color:inherit}
  h1,h2{margin:0;font-weight:600;letter-spacing:-.02em}
  p{margin:0}
  .num{font-variant-numeric:tabular-nums}
  .pretty{text-wrap:pretty}
  .flex{display:flex}.col{display:flex;flex-direction:column}.wrapx{flex-wrap:wrap}.center{align-items:center}
  .gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap9{gap:9px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}.gap20{gap:20px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 26px;
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .tab{cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;padding:8px 15px;border-radius:20px}
  .tab:hover{color:var(--text2)}
  .tab.active{background:var(--interactive);color:var(--text);font-weight:600;padding:8px 18px}
  .tab:disabled{cursor:default}
  .runmeta{display:flex;align-items:center;gap:16px;font-size:11.5px;color:var(--meta)}
  .status-live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--pass);
    background:rgba(184,137,46,.12);border:1px solid rgba(184,137,46,.32);padding:5px 11px;border-radius:16px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pass)}

  .card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);box-shadow:none;border-radius:3px;padding:16px 18px}
  .card.tight{padding:0;overflow:hidden}
  .sub{background:var(--elevated);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
  .kicker{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--gold);text-transform:uppercase}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
  .lede{font-size:11.5px;color:var(--muted)}
  .grid{display:grid;gap:12px}
  .col5{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .col2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
  .colcards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .colstats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .colwide{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:36px;align-items:center;
    border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:3px;padding:26px 30px;
    background:linear-gradient(135deg,var(--navy2) 0%,var(--navy) 100%)}
  .verdict{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
  .verdict-note{font-size:14px;line-height:1.6;color:var(--text2);max-width:520px}
  .pill{font-size:11px;font-weight:600;letter-spacing:.03em;padding:5px 11px;border-radius:5px;white-space:nowrap}
  .gauge{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--border);padding-left:34px}
  .gauge-foot{font-size:11.5px;color:var(--muted);border-top:1px solid rgba(203,201,194,.60);padding-top:9px}

  .metric{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);
    border-radius:3px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
  .metric-spark{margin-top:auto;padding-top:6px;width:100%}
  .ovcards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:1100px){.ovcards{grid-template-columns:repeat(3,1fr)}}
  .ovcard{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:3px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
  .ovcard-k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ovcard-v{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
  .ovcard-v.neg{color:var(--fail)}
  .ovcard-s{font-size:10.5px;color:var(--meta)}
  table.wide{width:100%;border-collapse:collapse;font-size:12px}
  table.wide th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border)}
  table.wide td{padding:8px 10px;border-bottom:1px solid var(--border-soft);color:var(--text2)}
  table.wide td.pl0,table.wide th.pl0{padding-left:0}
  .tinynote{font-size:10.5px;color:var(--meta);margin-top:8px;line-height:1.5}
  details.ledger>summary{cursor:pointer;color:var(--gold);font-size:12px;padding:4px 0;list-style:none}
  details.ledger>summary::-webkit-details-marker{display:none}
  details.ledger>summary::before{content:"\25b8 ";color:var(--gold)}
  details.ledger[open]>summary::before{content:"\25be "}
  .metric:hover{border-color:#CBC9C2;background:var(--interactive)}
  .metric-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .metric-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
  .metric-body{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .metric-value{font-size:29px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .metric-sub{font-size:12px;color:var(--text2)}
  .metric-foot{font-size:11.5px;color:var(--meta)}
  .chev{font-size:12.5px;color:var(--meta)}

  .fam{text-align:left;cursor:pointer;background:var(--elevated);border:1px solid var(--border);
    border-radius:9px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
  .fam:hover{border-color:#CBC9C2;background:var(--interactive)}
  .rank{width:20px;height:20px;border-radius:50%;border:1px solid #CBC9C2;display:flex;align-items:center;
    justify-content:center;font-size:10.5px;color:var(--text2);flex:0 0 auto}
  .sev{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:4px;white-space:nowrap}
  .sev-severe{background:rgba(176,65,62,.12);color:var(--fail);border:1px solid rgba(176,65,62,.32)}
  .sev-advisory{background:rgba(197,127,26,.12);color:var(--warn);border:1px solid rgba(197,127,26,.30)}
  .sev-review{background:rgba(58,107,165,.12);color:var(--info);border:1px solid rgba(58,107,165,.30)}
  .sev-pass{background:rgba(184,137,46,.12);color:var(--pass);border:1px solid rgba(184,137,46,.32)}
  .concern{font-size:12px;color:var(--muted);line-height:1.5}
  .check{width:16px;height:16px;border-radius:4px;border:1.5px solid #CBC9C2;flex:0 0 auto}
  .signoff-row{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:9.5px;font-weight:700;letter-spacing:.10em;color:var(--meta);text-align:left;padding:8px 10px;
    border-bottom:1px solid var(--border);border-top:1px solid var(--border);white-space:nowrap}
  td{padding:13px 10px;border-bottom:1px solid var(--border-soft);color:var(--text2)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:rgba(244,242,237,.85)}
  .pl0{padding-left:0}
  .name{padding-left:20px;color:var(--text);font-weight:500}
  .r{text-align:right}.c{text-align:center}
  .evidence-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 20px 14px;flex-wrap:wrap}
  .ghost-btn{cursor:pointer;background:var(--elevated);border:1px solid var(--border-hi);border-radius:7px;
    padding:8px 14px;font-size:12px;color:var(--text2);font-weight:500}
  .ghost-btn:hover{border-color:var(--pass);color:#17191C}

  .footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:4px}
  .dl{font-size:12px;font-weight:500;color:var(--text2);padding:8px 14px;border:1px solid var(--border-hi);
    border-radius:7px;background:var(--surface)}
  .dl:hover{border-color:var(--pass);color:#17191C;text-decoration:none}
  .disclaimer{font-size:11px;color:var(--meta);max-width:640px}

  .back{align-self:flex-start;background:none;border:none;padding:0;cursor:pointer;font-size:12.5px;color:var(--pass);font-weight:500}
  .detail{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:24px 26px;
    display:flex;flex-direction:column;gap:22px}
  .detail h2{font-size:22px}
  .detail-lede{font-size:13.5px;line-height:1.65;color:var(--text2);max-width:680px}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
  .kv span:first-child{color:var(--text)}
  .kv span:last-child{color:var(--text2)}
  .chart-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .driver{font-size:13px;line-height:1.65;color:var(--text2);padding:9px 0;border-bottom:1px solid var(--border-soft)}

  details{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--elevated)}
  details summary{cursor:pointer;list-style:none;padding:14px 16px;display:grid;gap:14px;align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary:hover{background:var(--interactive)}
  .f-family summary{grid-template-columns:1fr auto auto}
  .f-all summary{grid-template-columns:1fr auto auto auto}
  .f-title{font-size:13.5px;font-weight:600;color:var(--text)}
  .f-standard{font-size:11.5px;color:var(--meta)}
  .f-measured{font-size:14px;font-weight:600}
  .f-body{padding:12px 16px 14px;border-top:1px solid var(--border-soft);font-size:13px;line-height:1.65;color:var(--text2)}
  .filters{background:var(--elevated);border:1px solid var(--border);border-radius:9px;padding:14px 16px;
    display:flex;flex-direction:column;gap:10px}
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .filter-label{font-size:9.5px;font-weight:700;letter-spacing:.10em;color:var(--meta);width:66px}
  .chip{cursor:pointer;font-size:12px;font-weight:500;padding:6px 12px;border-radius:6px;
    border:1px solid var(--border-hi);background:var(--surface);color:var(--text2)}
  .chip:hover{border-color:var(--pass)}
  .chip[aria-pressed="true"]{background:rgba(184,137,46,.14);border-color:rgba(184,137,46,.40);color:var(--pass)}
  .filter-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(203,201,194,.60);
    padding-top:10px;font-size:12px;color:var(--text2)}
  .link-btn{background:none;border:none;padding:0;cursor:pointer;font-size:12px;color:var(--pass);font-weight:500;align-self:flex-start}
  .empty{border:1px dashed var(--border-hi);border-radius:9px;padding:24px;text-align:center;font-size:13px;color:var(--meta)}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   DATA — every visible string, number and series lives here.
   No content is baked into the HTML; all views render from these.
   ============================================================ */

var THEME = {
  pass:"#B8892E", warn:"#C57F1A", fail:"#B0413E", info:"#3A6BA5", ink:"#17191C",
  grid:"rgba(150,146,140,.15)", axis:"rgba(150,146,140,.22)", scaleTrack:"rgba(203,201,194,.65)"
};

/*__FOUNDRY_DATA_INJECTION__*/
var state = { view:"home", arg:null, filters:{ severity:"All", family:"All", status:"All" } };

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function tone(t){ return THEME[t] || THEME.ink; }
function sevTone(s){ return s === "severe" ? "fail" : s === "advisory" ? "warn" : "info"; }
function sevColor(s){ return tone(sevTone(s)); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function statusLabel(s){ return s === "open" ? "Open" : "Resolved"; }

function points(series, w, h, pad){
  var n = series.length; if(!n) return "";
  var lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
  var rng = (hi - lo) || 1;
  return series.map(function(v,i){
    var x = n===1 ? w/2 : pad + (i/(n-1))*(w - 2*pad);
    var y = pad + (1 - (v - lo)/rng)*(h - 2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
}
function areaPoints(series, w, h, pad){ return pad + "," + (h-pad) + " " + points(series, w, h, pad) + " " + (w-pad) + "," + (h-pad); }
function sparkPointList(series, w, h, pad){
  var n = series.length; if(!n) return [];
  var lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
  var rng = (hi - lo) || 1;
  return series.map(function(v,i){
    return { x: n===1 ? w/2 : pad + (i/(n-1))*(w - 2*pad),
             y: pad + (1 - (v - lo)/rng)*(h - 2*pad) };
  });
}
function sparkline(series, color, w, h, pad, stroke){
  w = w || 240; h = h || 84; pad = pad || 12; stroke = stroke || 2.4;
  var pts = sparkPointList(series, w, h, pad);
  var dots = pts.map(function(p,i){
    var last = i===pts.length-1;
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(last?4.5:3)+'" fill="'+(last?color:"var(--surface)")+'" stroke="'+color+'" stroke-width="'+(last?0:1.6)+'"></circle>';
  }).join("");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:'+h+'px;display:block" aria-hidden="true">' +
    '<polygon points="' + areaPoints(series, w, h, pad) + '" fill="' + color + '" opacity=".08"></polygon>' +
    '<polyline points="' + points(series, w, h, pad) + '" fill="none" stroke="' + color +
    '" stroke-width="' + stroke + '" stroke-dasharray="0.5 5" stroke-linecap="round"></polyline>' +
    dots + '</svg>';
}
function levelY(series, level, h, pad){
  var min = Math.min.apply(null, series), max = Math.max.apply(null, series), span = (max - min) || 1;
  return (pad + (1 - (level - min) / span) * (h - pad * 2)).toFixed(1);
}
function sparkline(series, color, w, h, pad, stroke){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:' + w + 'px;height:' + h +
    'px;flex:0 0 auto" aria-hidden="true">' +
    '<polygon points="' + areaPoints(series, w, h, pad) + '" fill="' + color + '" opacity=".13"></polygon>' +
    '<polyline points="' + points(series, w, h, pad) + '" fill="none" stroke="' + color + '" stroke-width="' + stroke +
    '" vector-effect="non-scaling-stroke"></polyline></svg>';
}
function bigChart(series, color, threshold){
  var w = 900, h = 220, pad = 16, out = "";
  if (threshold == null){
    out += '<line x1="0" y1="60" x2="900" y2="60" stroke="' + THEME.grid + '" stroke-width="1"></line>' +
           '<line x1="0" y1="130" x2="900" y2="130" stroke="' + THEME.grid + '" stroke-width="1"></line>' +
           '<line x1="0" y1="200" x2="900" y2="200" stroke="' + THEME.axis + '" stroke-width="1"></line>';
  } else {
    var y = levelY(series, threshold, h, pad);
    out += '<line x1="0" y1="' + y + '" x2="900" y2="' + y + '" stroke="' + THEME.fail +
           '" stroke-width="1" stroke-dasharray="6 5"></line>';
  }
  out += '<polygon points="' + areaPoints(series, w, h, pad) + '" fill="' + color + '" opacity=".12"></polygon>' +
         '<polyline points="' + points(series, w, h, pad) + '" fill="none" stroke="' + color + '" stroke-width="2.2"></polyline>';
  return out;
}

/* ---- chrome ---- */
function topbar(){
  return '<div class="topbar"><div class="flex center wrapx" style="gap:26px">' +
    '<div class="brand">' +
      '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3l5 5-5 5-5-5z" fill="#7C6CF0"></path>' +
      '<path d="M16 9l5 5-5 5-5-5z" fill="#8B7BF7"></path></svg><span>' + esc(MODEL.product) + '</span></div>' +
    '<nav class="tabs"><button class="tab' + (state.view==="home"?" active":"") + '" type="button" data-nav="home">' + esc(MODEL.section) + '</button>' +
      MODEL.navTabs.map(function(t){ return '<button class="tab' + (state.view===t.view?' active':'') + '" type="button" data-nav="' + t.view + '" title="' + esc(t.label) + '">' + esc(t.label) + '</button>'; }).join("") +
    '</nav></div>' +
    '<div class="runmeta"><span>' + esc(MODEL.version) + ' · ' + esc(MODEL.generated) + '</span>' +
    '<span class="status-live"><span class="dot"></span>' + esc(MODEL.freshness) + '</span></div></div>';
}

/* ---- landing ---- */
function heroPanel(){
  var color = tone(VERDICT.cls === "ok" ? "pass" : VERDICT.cls === "bad" ? "fail" : "warn");
  var verdictColor = VERDICT.cls === "bad" ? THEME.fail : THEME.pass;
  var pills = VERDICT.pills.map(function(p){
    var c = tone(p.tone), rgb = p.tone === "pass" ? "49,208,170" : p.tone === "warn" ? "243,167,74" : "255,107,94";
    return '<span class="pill" style="color:' + c + ';background:rgba(' + rgb + ',.12);border:1px solid rgba(' + rgb + ',.32)">' +
      esc(p.text) + '</span>';
  }).join("");

  var x0 = 8, x1 = 632, span = GAUGE.scaleMax - GAUGE.scaleMin;
  var xr = x0 + (GAUGE.requirement.value - GAUGE.scaleMin) / span * (x1 - x0);
  var xm = x0 + (GAUGE.model.value - GAUGE.scaleMin) / span * (x1 - x0);
  var ok = GAUGE.model.value >= GAUGE.requirement.value;
  var markColor = ok ? THEME.pass : THEME.fail;
  var fmt = function(v){ return v.toFixed(v % 1 === 0 ? 1 : 2) + "%"; };

  return '<div class="hero"><div class="flex" style="gap:24px;align-items:flex-start">' +
    '<svg width="70" height="70" viewBox="0 0 70 70" style="flex:0 0 auto" aria-hidden="true">' +
      '<path d="M35 6l24 9v20c0 15-10 24-24 29-14-5-24-14-24-29V15z" fill="none" stroke="' + verdictColor + '" stroke-width="2.5" opacity=".85"></path>' +
      '<path d="M24 34l8 8 15-15" fill="none" stroke="' + verdictColor + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
    '<div class="col gap10"><h1 class="verdict pretty" style="color:' + verdictColor + '">' + esc(VERDICT.call) + '</h1>' +
      '<p class="verdict-note pretty">' + esc(VERDICT.reasoning) + '</p>' +
      '<div class="flex center wrapx gap10" style="margin-top:2px"><span class="lede">' + esc(VERDICT.label) + '</span>' +
      pills + '<span class="lede">' + esc(VERDICT.readinessLine) + '</span></div></div></div>' +

    '<div class="gauge"><div class="eyebrow">' + esc(GAUGE.title) + '</div>' +
    '<svg viewBox="0 0 640 78" style="width:100%;height:78px" role="img" aria-label="' +
      esc("Model minimum " + fmt(GAUGE.model.value) + " against a " + fmt(GAUGE.requirement.value) + " requirement") + '">' +
      '<line x1="' + x0 + '" y1="26" x2="' + xr.toFixed(1) + '" y2="26" stroke="' + THEME.scaleTrack + '" stroke-width="2"></line>' +
      '<line x1="' + xr.toFixed(1) + '" y1="26" x2="' + xm.toFixed(1) + '" y2="26" stroke="' + markColor + '" stroke-width="2" stroke-dasharray="2 2"></line>' +
      '<line x1="' + xm.toFixed(1) + '" y1="26" x2="' + x1 + '" y2="26" stroke="' + THEME.axis + '" stroke-width="2" stroke-dasharray="3 4"></line>' +
      '<circle cx="' + xr.toFixed(1) + '" cy="26" r="5" fill="#FBFAF7" stroke="#96928C" stroke-width="2"></circle>' +
      '<circle cx="' + xm.toFixed(1) + '" cy="26" r="5" fill="' + markColor + '"></circle>' +
      '<text x="' + x0 + '" y="52" font-size="12" font-weight="600" fill="#A8B7D3" font-family="inherit">' + fmt(GAUGE.scaleMin) + '</text>' +
      '<text x="' + (xr - 10).toFixed(1) + '" y="52" text-anchor="end" font-size="14" font-weight="600" fill="#17191C" font-family="inherit">' + fmt(GAUGE.requirement.value) + '</text>' +

    '<h2>Financial summary</h2>' +
    '<p class="detail-lede pretty">' + esc(f.note || "Year-end balances; annual flows. Every figure is engine-computed from the assumptions.") + '</p></div>' +
    '<div class="card"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '</div></section>';
}

function matches(f){
  var s = state.filters;
  return (s.severity === "All" || s.severity.toLowerCase() === f.severity) &&
         (s.family === "All" || s.family === FAM_LABEL[f.family]) &&
         (s.status === "All" || s.status.toLowerCase() === f.status);
}

function viewScenariosAll(){
  var c = COPY.evidence;
  var rows = SCEN.map(function(s){
    return '<tr class="clickable" data-scenario="' + s.id + '">' +
      '<td class="pl0" style="color:var(--text);font-weight:500">' + esc(s.name) + '</td>' +
      '<td class="r num" style="color:' + (s.pass ? "var(--pass)" : "var(--fail)") + '">' + esc(s.value) + '</td>' +
      '<td class="r num">' + esc(CONSTRAINT.thresholdLabel) + '</td>' +
      '<td class="r"><span class="sev sev-' + (s.pass ? "review" : "severe") + '">' + (s.pass ? "PASS" : "BREACH") + '</span></td>' +
      '<td>' + esc(s.source) + '</td>' +
      '<td class="r" style="color:var(--meta)">' + esc(s.note) + '</td>' +
      '<td class="r chev" style="width:14px">\u203a</td></tr>';
  }).join("");
  return '<section class="col gap14">' + backBtn() + '<div class="detail" style="gap:18px">' +
    '<div class="col gap10"><span class="eyebrow">SCENARIOS</span><h2>Scenario evidence</h2>' +
    '<p class="detail-lede pretty">' + esc(c.lede) + ' Click any scenario for its leverage path and drivers.</p></div>' +
    '<div class="card"><table><thead><tr>' +
    c.columns.map(function(h){ return '<th class="' + (h===c.columns[0]?"pl0":"r") + '">' + esc(h) + '</th>'; }).join("") +
    '<th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div></section>';
}

function viewCoherence(){
  var c = COPY.coherence;
  var cards = COHERENCE.map(function(x){
    return '<div class="card col gap6"><div class="flex center gap8">' +
      '<span style="font-weight:600;color:var(--text)">' + esc(x.title) + '</span>' +
      '<span class="sev sev-' + x.severity + '">' + x.severity.toUpperCase() + '</span></div>' +
      '<span style="font-size:12.5px;color:var(--text2);line-height:1.5">' + esc(x.value) + '</span>' +
      (x.basis ? '<span style="font-size:11px;color:var(--meta)">' + esc(x.basis) + '</span>' : "") + '</div>';
  }).join("");
  return '<section class="col gap14">' + backBtn() + '<div class="detail" style="gap:18px">' +
    '<div class="col gap10"><span class="eyebrow">MODEL CHECKS</span><h2>Does the bank hold together?</h2>' +
    '<p class="detail-lede pretty">' + esc(c.lede) + ' Findings from the engine\u2019s own projected outputs, judged against supervisory and economic standards.</p></div>' +
    (COHERENCE.length ? '<div class="grid col2">' + cards + '</div>'
       : '<div class="card"><p class="detail-lede">No modeled-output exceptions. The projected balance sheet, capital, concentrations, and earnings stay within tolerances.</p></div>') +
    '</div></section>';
}

function viewFindings(){
  var vis = FINDINGS.filter(matches), c = COPY.findings;
  return '<section class="col gap14">' + backBtn() + '<div class="detail" style="gap:18px">' +
    '<div class="col gap6"><h2>' + esc(c.title) + '</h2>' +
    '<span style="font-size:13px;color:var(--text2);line-height:1.6">' + esc(c.lede) + '</span></div>' +
    '<div class="filters">' + FILTER_DEFS.map(function(g){
      return '<div class="filter-row"><span class="filter-label">' + esc(g.label) + '</span>' +
        g.options.map(function(o){
          return '<button class="chip" type="button" data-filter="' + g.key + '" data-value="' + esc(o) +
            '" aria-pressed="' + (state.filters[g.key] === o) + '">' + esc(o) + '</button>';
        }).join("") + '</div>';
    }).join("") +
    '<div class="filter-foot"><span class="num">Showing ' + vis.length + ' of ' + FINDINGS.length + ' findings</span>' +
    '<button class="link-btn" type="button" data-reset="1">' + esc(c.reset) + '</button></div></div>' +
    '<div class="col gap8">' +
      (vis.length ? vis.map(function(f){ return findingRow(f, true); }).join("") : '<div class="empty">' + esc(c.empty) + '</div>') +
    '</div></div></section>';
}

/* ---- mount ---- */
var VIEWS = { home:viewHome, metric:viewMetric, scenario:viewScenario, family:viewFamily, findings:viewFindings, assumptions:viewAssumptions, financials:viewFinancials, scenarios:viewScenariosAll, coherence:viewCoherence };

function render(){
  document.getElementById("root").innerHTML =
    '<div class="app">' + topbar() + '<div class="wrap">' + VIEWS[state.view]() + '</div></div>';
}

function navigate(view, arg){ state.view = view; state.arg = arg || null; render(); window.scrollTo(0, 0); }

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-nav],[data-metric],[data-family],[data-scenario],[data-filter],[data-reset]");
  if (!t) return;
  if (t.dataset.reset){ state.filters = { severity:"All", family:"All", status:"All" }; render(); return; }
  if (t.dataset.filter){ state.filters[t.dataset.filter] = t.dataset.value; render(); return; }
  if (t.dataset.metric){ navigate("metric", t.dataset.metric); return; }
  if (t.dataset.scenario){ navigate("scenario", t.dataset.scenario); return; }
  if (t.dataset.family){ navigate("family", t.dataset.family); return; }
  if (t.dataset.nav){ navigate(t.dataset.nav, null); }
});

render();
</script>
</body>
</html>
